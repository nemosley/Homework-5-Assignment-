<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple Regex Example</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; padding: 24px; }
    h1 { font-size: 40px; margin: 0 0 18px 0; }
    label, p { margin: 8px 0; }
    input[type="text"] { padding: 8px; width: 260px; border: 1px solid #888; }
    button { padding: 6px 10px; margin-left: 8px; }
    #message { display: inline-block; margin-top: 12px; font-weight: 600; }
    #message.invalid { color: #d33; }
    #message.valid { color: #0a0; }
  </style>
</head>
<body>
  <h1>Simple Regex Example</h1>
  <p>Type the name(letters only)</p>
  <input id="nameInput" type="text" aria-label="name input" />
  <button id="validateBtn">Validate</button>
  <div id="message" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
